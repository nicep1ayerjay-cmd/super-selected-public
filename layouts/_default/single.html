{{ define "main" }}
  <article class="article">
    <header class="article-header">
      <div class="meta">
        {{ range .Params.categories }}<a href="{{ (printf "/categories/%s/" (. | urlize)) | relURL }}">{{ . }}</a>{{ end }}
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年01月02日" }}</time>
      </div>
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
    </header>
    <div class="prose">{{ .Content }}</div>
    {{ with .Params.sources }}
      <section class="sources">
        <h2>原始来源</h2>
        <ul>
          {{ range . }}<li><a href="{{ .url }}" rel="noopener noreferrer">{{ .name }}</a></li>{{ end }}
        </ul>
      </section>
    {{ end }}
  </article>
{{ end }}
