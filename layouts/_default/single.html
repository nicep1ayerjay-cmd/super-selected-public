{{ define "main" }}
  <article class="article">
    <nav class="breadcrumbs" aria-label="面包屑"><a href="{{ "/recommendations/" | relURL }}">全部精选对象</a><span>›</span><a href="{{ .Params.object_url | relURL }}">{{ .Params.object_name }}</a><span>›</span><span>{{ .Title }}</span></nav>
    <div class="prose">{{ .Content }}</div>
    {{ with .Params.sources }}
      <section class="sources">
        <h2>原始来源</h2>
        <ul>
          {{ range . }}<li><a href="{{ .url }}" rel="noopener noreferrer">{{ .name }}</a></li>{{ end }}
        </ul>
      </section>
    {{ end }}
  </article>
{{ end }}
