{{ define "main" }}
{{ $site := index hugo.Data.sites .Params.site_key }}
<section class="shell hero" data-screen-label="{{ .Params.page_kind }}">
  <p class="eyebrow">{{ .Params.eyebrow }}</p>
  <h1>{{ .Title }}</h1>
  <p class="lead">{{ .Description }}</p>
</section>
<section class="shell page-article">
  <article class="article-card">
    <div class="prose">{{ .Content }}</div>
  </article>
</section>
{{ end }}
