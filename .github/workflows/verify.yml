name: Verify public site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check recommendation metadata
        run: python3 scripts/check_content.py

      - name: Verify generated README is current
        run: |
          python3 scripts/update_readme.py
          git diff --exit-code README.md

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Build site
        run: hugo --minify --cleanDestinationDir

      - name: Verify crawler endpoints
        run: |
          test -f public/index.html
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f public/llms.txt

